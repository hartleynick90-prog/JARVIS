<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S - Weather Dashboard</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>🌤️ J.A.R.V.I.S Weather Dashboard</h1>
      <p>Real-time Weather Information</p>
    </header>

    <!-- Search Section -->
    <div class="search-section">
      <div class="search-box">
        <input 
          type="text" 
          id="cityInput" 
          placeholder="Enter city name..."
          autocomplete="off"
        >
        <button id="searchBtn">Search</button>
        <button id="locationBtn" title="Use current location">📍</button>
      </div>
      <div id="errorMessage" class="error-message"></div>
    </div>

    <!-- Main Weather Display -->
    <main class="weather-main" id="weatherMain" style="display: none;">
      <div class="weather-card">
        <div class="location-info">
          <h2 id="cityName"></h2>
          <p id="lastUpdated"></p>
        </div>

        <div class="current-weather">
          <div class="temp-section">
            <div class="temperature">
              <span id="temperature"></span>
              <span class="unit">°C</span>
            </div>
            <div class="weather-icon" id="weatherIcon"></div>
          </div>

          <div class="weather-description">
            <p id="weatherDesc"></p>
            <p id="feelsLike"></p>
          </div>
        </div>

        <!-- Weather Details Grid -->
        <div class="weather-details">
          <div class="detail-item">
            <span class="label">Humidity</span>
            <span class="value" id="humidity"></span>
          </div>
          <div class="detail-item">
            <span class="label">Wind Speed</span>
            <span class="value" id="windSpeed"></span>
          </div>
          <div class="detail-item">
            <span class="label">Pressure</span>
            <span class="value" id="pressure"></span>
          </div>
          <div class="detail-item">
            <span class="label">Visibility</span>
            <span class="value" id="visibility"></span>
          </div>
          <div class="detail-item">
            <span class="label">UV Index</span>
            <span class="value" id="uvIndex">N/A</span>
          </div>
          <div class="detail-item">
            <span class="label">Cloudiness</span>
            <span class="value" id="clouds"></span>
          </div>
        </div>

        <!-- Sunrise/Sunset -->
        <div class="sun-times">
          <div class="sun-item">
            <span class="label">🌅 Sunrise</span>
            <span class="value" id="sunrise"></span>
          </div>
          <div class="sun-item">
            <span class="label">🌇 Sunset</span>
            <span class="value" id="sunset"></span>
          </div>
        </div>
      </div>
    </main>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner" style="display: none;">
      <div class="spinner"></div>
      <p>Loading weather data...</p>
    </div>

    <!-- Welcome Message -->
    <div id="welcomeMessage" class="welcome-message">
      <h3>Welcome to J.A.R.V.I.S</h3>
      <p>Search for a city or use your current location to get started!</p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
